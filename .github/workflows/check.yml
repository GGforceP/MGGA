name: MGGA Validate
on:
  push:
    paths:
      - 'data/games.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python scripts/validate.py
          python -m unittest discover -s tests -v
